services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labmate_password}
      POSTGRES_DB: ${POSTGRES_DB:-labmate_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labmate -d labmate_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_connections=200

  # Local Redis (optional - only used if REDIS_URL is not set)
  # Uncomment if you want to use local Redis instead of cloud Redis
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
      # Note: Ports 3000 and 3001 are used internally by Docker-in-Docker containers
      # They communicate with Playwright inside the backend container via localhost
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-labmate}:${POSTGRES_PASSWORD:-labmate_password}@postgres:5432/${POSTGRES_DB:-labmate_db}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - BETA_KEY=${BETA_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - DATA_DIR=/data
      - HOST_PROJECT_ROOT=${PWD}
      - JAVA_COMMAND=java
      - JAVAC_COMMAND=javac
      - C_COMPILER=gcc
      - CPP_COMPILER=g++
      - RATE_LIMIT_ENABLED=false
      - RATE_LIMIT_PER_MINUTE=1000
      - WORKFLOW_WORKERS=0
    volumes:
      - ./backend/uploads:/data/uploads
      - ./backend/screenshots:/data/screenshots
      - ./backend/reports:/data/reports
      - ./backend/react_temp:/data/react_temp  # Temp directory for React projects
    depends_on:
      postgres:
        condition: service_healthy
      # redis:  # Uncomment if using local Redis
      #   condition: service_healthy
    command: ["/app/start.sh"]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-labmate}:${POSTGRES_PASSWORD:-labmate_password}@postgres:5432/${POSTGRES_DB:-labmate_db}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY}
      - DATA_DIR=/data
      - LABMATE_ROLE=worker
      - WORKFLOW_WORKERS=2
      - JAVA_COMMAND=java
      - JAVAC_COMMAND=javac
      - C_COMPILER=gcc
      - CPP_COMPILER=g++
    volumes:
      - ./backend/uploads:/data/uploads
      - ./backend/screenshots:/data/screenshots
      - ./backend/reports:/data/reports
      - ./backend/react_temp:/data/react_temp
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: ["/app/start.sh"]

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
