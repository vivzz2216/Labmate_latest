<!doctype html><html><head><meta charset="utf-8"><title>{{ editor_name }} — {{ filename }}</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#e8edf3;color:#182238;font:13px Arial,sans-serif}.window{background:{{ editor_background }};border:1px solid #a7b4c4;border-radius:5px;overflow:hidden;margin-bottom:20px}.bar{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;background:{{ bar_background }};color:{{ bar_foreground }};font-size:12px}.buttons{display:flex;gap:22px}.menus{padding:9px 15px;background:#f4f6f8;border-bottom:1px solid #d4dbe5;color:#39465b;word-spacing:16px;font-size:11px}.code{padding:16px 18px;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4;font:12px/1.6 Consolas,monospace;min-height:150px;color:{{ editor_foreground }};background:{{ editor_background }}}.status{padding:7px 13px;background:#edf1f6;color:#66758c;font-size:10px}.terminal{background:#12161c;border:1px solid #748194;border-radius:4px;overflow:hidden}.terminal .bar{background:#263142;color:#eaf1fc}.output{padding:17px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#eef4fc;min-height:80px;font:12px/1.6 Consolas,monospace}.keyword{color:#c35b07}.string{color:#159147}.comment{color:#bb3c4e}.number{color:#7638ad}.builtin{color:#254c98}.function,.class-name{color:#2d6fae}.preprocessor{color:#0b8064}.code-highlight{white-space:pre-wrap}.caption{color:#728197;font-size:10px;margin:14px 0 0}
</style></head><body>
<div class="window"><div class="bar"><span>{{ filename }} — {{ editor_name }}</span><span class="buttons">− □ ×</span></div><div class="menus">File Edit View Run</div><div class="code">{{ code_content }}</div><div class="status">{{ language_label }} · UTF-8</div></div>
<div class="terminal"><div class="bar"><span>{{ terminal_name }}</span><span class="buttons">− □ ×</span></div><pre class="output">{{ output_content }}</pre></div>
<p class="caption">Captured program output · {{ username }}</p>
</body></html>
